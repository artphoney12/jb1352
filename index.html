<!doctype html>
<html manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PS4 JB Multi-FW 13.02 / 13.04 / 13.50 / 13.52</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#070a0e;color:#e7edf5;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .panel{width:min(760px,96vw);background:#0d1218;border:1px solid #202a35;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .topline{height:3px;background:linear-gradient(90deg,#3d7cff,#74a2ff,#3d7cff)}
    .content{padding:34px 34px 30px}
    .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#748399;margin-bottom:10px}
    h1{font-size:32px;margin:0 0 8px;line-height:1.15}
    .subtitle{margin:0;color:#9eabba;font-size:15px}
    .badges{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
    .badge{padding:8px 11px;border:1px solid #263444;border-radius:999px;background:#111923;color:#a9bbd1;font-size:12px;font-weight:700}
    .badge.gold{color:#e4c574;border-color:#4b4122;background:#18160e}
    .box{margin-top:14px;border:1px solid #202b37;background:#0a0f14;border-radius:10px;padding:16px}
    .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#65758b;margin-bottom:7px}
    #det{font-size:16px;line-height:1.55}
    #state{margin-top:16px;font-size:14px;font-weight:700;color:#9eb5d3}
    #cache{margin-top:8px;font-size:13px;color:#77879a}
    .progress{height:6px;background:#151e28;border-radius:99px;margin-top:14px;overflow:hidden}
    #progressbar{height:100%;width:0;background:#5c8fe8;transition:width .2s ease}
    .footer-note{margin-top:20px;color:#68788c;font-size:12px;line-height:1.6}
    .ok{color:#7fd0a0!important}.warn{color:#dfc16d!important}.bad{color:#e58d82!important}
    @media(max-width:600px){.content{padding:25px 19px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="topline"></div>
    <div class="content">
      <div class="eyebrow">PlayStation 4 Jailbreak Host</div>
      <h1>PS4 JB MULTI-FW 13.02–13.52</h1>
      <p class="subtitle">Supported firmware: 13.02 · 13.04 · 13.50 · 13.52 · automatic payload selection</p>
      <div class="box">
        <div class="label">Firmware / Payload</div>
        <div id="det">Detecting firmware...</div>
        <div id="state">Preparing jailbreak host...</div>
        <div id="cache">Checking offline cache...</div>
        <div class="progress"><div id="progressbar"></div></div>
      </div>
    </div>
  </main>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var progressEl = document.getElementById("progressbar");

    function setState(t, c) {
        stateEl.textContent = t;
        stateEl.className = c || "";
    }
    function setCache(t, c) {
        cacheEl.textContent = t;
        cacheEl.className = c || "";
    }
    function setProgress(pct) {
        pct = Math.max(0, Math.min(100, pct || 0));
        progressEl.style.width = pct + "%";
    }

    var SUPPORTED = {
        1302: "goldhen2.4b18.12.bin",
        1304: "goldhen2.4b18.12.bin",
        1350: "goldhen2.4b18.12.bin",
        1352: "payload2.bin"
    };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

    if (m) {
        var minor = parseInt(m[2], 16).toString(16);
        if (minor.length < 2) minor = "0" + minor;
        key = m[1] + "." + minor;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(minor, 10);
    }

    var params = new URLSearchParams(location.search);
    var forced = params.get("force") === "1";
    var payload = fwnum !== null ? SUPPORTED[fwnum] : null;
    var supported = forced || !!payload;

    if (payload) {
        var payloadLabel = payload === "goldhen2.4b18.12.bin"
            ? "GoldHEN v2.4b18.12"
            : "13.52 dedicated payload";
        detEl.innerHTML =
            'Detected firmware <b>' + key + '</b> &middot; payload: <b>' + payloadLabel + '</b>';
        setState("SUPPORTED FIRMWARE — automatic payload routing enabled", "ok");
    } else if (forced) {
        detEl.innerHTML = 'Forced developer mode &middot; detected firmware <b>' + (key || "unknown") + '</b>';
        setState("FORCED MODE — firmware is outside the supported list", "warn");
    } else {
        detEl.innerHTML =
            'Detected firmware <b>' + (key || "unknown") + '</b> &middot; unsupported';
        setState("UNSUPPORTED FIRMWARE", "bad");
        setCache("Supported only: 13.02, 13.04, 13.50 and 13.52.", "bad");
        setProgress(0);
        return;
    }

    var target = "jb.html" + location.search;
    var launched = false;

    function go() {
        if (launched) return;
        launched = true;
        setState("Loading jailbreak with the firmware-specific payload...", "warn");
        setProgress(100);
        setTimeout(function () {
            location.replace(target);
        }, 250);
    }

    var ac = window.applicationCache;

    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        setCache("Application cache unavailable — continuing online.", "warn");
        go();
        return;
    }

    if (!navigator.onLine) {
        setCache("Offline mode — using existing cache.", "ok");
        setProgress(100);
        go();
        return;
    }

    if (ac.status === ac.IDLE) {
        setCache("Offline cache ready.", "ok");
        setProgress(100);
        go();
        return;
    }

    if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("Cache update ready — reloading once.", "ok");
        setProgress(100);
        setTimeout(function () { location.reload(); }, 300);
        return;
    }

    setCache("Downloading / verifying offline cache...");
    setProgress(10);

    ac.addEventListener("downloading", function () {
        setCache("Downloading offline cache...");
        setProgress(20);
    }, false);

    ac.addEventListener("progress", function (e) {
        if (e && e.total) {
            var pct = Math.round((e.loaded / e.total) * 100);
            setProgress(pct);
            setCache("Downloading offline cache... " + pct + "%");
        }
    }, false);

    ac.addEventListener("cached", function () {
        setCache("Offline cache installed.", "ok");
        setProgress(100);
        go();
    }, false);

    ac.addEventListener("noupdate", function () {
        setCache("Offline cache is current.", "ok");
        setProgress(100);
        go();
    }, false);

    ac.addEventListener("updateready", function () {
        try { ac.swapCache(); } catch (e) {}
        setCache("New cache installed — reloading once.", "ok");
        setProgress(100);
        setTimeout(function () { location.reload(); }, 300);
    }, false);

    ac.addEventListener("error", function () {
        setCache("Cache update failed — continuing online.", "warn");
        go();
    }, false);

    ac.addEventListener("obsolete", function () {
        setCache("Cache manifest obsolete — continuing online.", "warn");
        go();
    }, false);
})();
</script>
</body>
</html>
