<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 Jailbreak | artphoney</title>
    <style>
      html, body { 
        margin:0; padding:0; 
        background: linear-gradient(135deg, #0b0d10 0%, #161b22 100%); 
        color:#c8ced8;
        font:15px/1.45 "Inter", "Segoe UI", system-ui, sans-serif; 
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #brand { 
        text-align:center; padding:15px 20px; 
        background: rgba(14, 17, 22, 0.7);
        backdrop-filter: blur(10px);
        border-bottom:1px solid rgba(255, 255, 255, 0.05); 
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      }
      .brand-title { 
        font-size:18px; font-weight:800; letter-spacing:.1em;
        color:#e6ebf2; 
      }
      .brand-subtitle {
        font-size: 13px; color: #8b95a3; margin-top: 4px;
      }
      .brand-subtitle b { color: #7fd0a0; }
      
      #credits {
        text-align: center; padding: 15px; font-size: 12px; color: #5c6672;
        background: rgba(11, 13, 16, 0.8);
        border-top: 1px solid rgba(255,255,255,0.05);
        margin-top: auto;
      }
      #credits a {
        color: #4ca1af; text-decoration: none; font-weight: 600; transition: color 0.3s;
      }
      #credits a:hover { color: #7fd0a0; }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% - 40px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      #progress-wrapper {
        position: fixed;
        top: calc(50% + 40px);
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        max-width: 400px;
        text-align: center;
      }
      #progress-text {
        font-size: 14px;
        color: #8b95a3;
        margin-bottom: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #progress-container {
        width: 100%;
        height: 12px;
        background: #1e2732;
        border-radius: 6px;
        overflow: hidden;
      }
      #progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4ca1af, #7fd0a0);
        transition: width 0.3s ease;
      }

      #msg-fail, #msg-success {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 0.5px;
        display: none;
      }
      #msg-fail { color: #d08a7f; }
      #msg-success { color: #7fd0a0; }
      
      #wrap { padding: 0; }
      #state, #out { display: none; }

      body.done #spin, body.done #progress-wrapper { display: none; }
      body.fail #spin, body.fail #progress-wrapper { display: none; }
      body.fail #msg-fail { display: block; }
      body.done #msg-success { display: block; }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <div class="brand-title">PS4 13.52 Jailbreak</div>
      <div class="brand-subtitle">by <b>artphoney</b></div>
    </div>
    <div id="spin"></div>
    <div id="progress-wrapper">
      <div id="progress-text">Starting Jailbreak...</div>
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>
    </div>
    <div id="msg-fail">Jailbreak failed.<br><br>Please restart your PS4 first!</div>
    <div id="msg-success">Jailbreak Successful! 🎉</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
    <footer id="credits">
      Original implementation by <a href="https://github.com/thebelx" target="_blank">thebelx</a>
    </footer>
  </body>
</html>
